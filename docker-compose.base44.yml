services:
  web:
    image: node:22-slim
    working_dir: /app/frontend
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./frontend/package-lock.json:/app/frontend/package-lock.json
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
