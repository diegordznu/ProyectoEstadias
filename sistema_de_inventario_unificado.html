<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Industrial Armas Durango - Inventario</title>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --btn-blue: #0047AB;
      --btn-green: #00c853;
      --btn-red: #8b0000;
      --btn-gray: #333333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1, h2 {
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    /* Ocultar elementos */
    .hidden {
      display: none !important;
    }

    /* Botones Gigantes */
    button {
      border: none;
      border-radius: 0;
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 30px 20px;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.8;
    }

    .btn-blue { background-color: var(--btn-blue); }
    .btn-green { background-color: var(--btn-green); }
    .btn-red { background-color: var(--btn-red); }
    .btn-gray { background-color: var(--btn-gray); }

    /* Cuadrícula del Menú */
    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      height: 60vh;
    }

    /* Formularios e Inputs */
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 1.2rem;
      text-transform: uppercase;
    }
    input, select {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 2px solid var(--text-color);
      border-radius: 0;
      padding: 15px;
      font-size: 1.2rem;
      width: 100%;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--btn-green);
    }
    
    .center-container {
      max-width: 600px;
      margin: 0 auto;
      padding-top: 5vh;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid var(--text-color);
    }
    th, td {
      border: 1px solid var(--text-color);
      padding: 15px;
      text-align: left;
      font-size: 1.1rem;
    }
    th {
      background-color: var(--text-color);
      color: var(--bg-color);
      text-transform: uppercase;
    }

    /* Sistema de Mensajes (reemplazo de alert) */
    #message-box {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--text-color);
      color: var(--bg-color);
      padding: 20px 40px;
      font-weight: bold;
      font-size: 1.2rem;
      border: 4px solid var(--btn-green);
      z-index: 1000;
      text-transform: uppercase;
    }
    .msg-error { border-color: var(--btn-red) !important; }
  </style>
</head>
<body>

  <div id="message-box" class="hidden">MENSAJE DEL SISTEMA</div>

  <header>
    <h1>GRUPO INDUSTRIAL ARMAS DURANGO</h1>
  </header>

  <!-- 1. PANTALLA DE INICIO DE SESIÓN -->
  <div id="screen-login" class="center-container">
    <div class="form-group">
      <label>USUARIO:</label>
      <input type="text" id="login-user" placeholder="INGRESE USUARIO">
    </div>
    <div class="form-group">
      <label>CONTRASEÑA:</label>
      <input type="password" id="login-pass" placeholder="INGRESE CONTRASEÑA">
    </div>
    <button class="btn-green" id="btn-login" style="padding: 40px 20px; font-size: 2rem; margin-top: 20px;">INICIAR SESION</button>
  </div>

  <!-- 2. MENÚ PRINCIPAL -->
  <div id="screen-menu" class="hidden">
    <div class="grid-menu">
      <button class="btn-blue" onclick="showScreen('screen-inventory')">VISTA GENERAL<br>DE INVENTARIO</button>
      <button class="btn-blue" onclick="showScreen('screen-transfer')">REGISTRAR<br>TRASPASO INTERNO</button>
      <button class="btn-blue" onclick="showScreen('screen-history')">HISTORIAL<br>DE TRASPASOS</button>
      <button class="btn-red" id="btn-logout">CERRAR SESIÓN</button>
    </div>
  </div>

  <!-- 3. VISTA GENERAL DE INVENTARIO -->
  <div id="screen-inventory" class="hidden">
    <h2>INVENTARIO UNIFICADO</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>PIEZA / SKU</th>
            <th>PLANTA 1</th>
            <th>PLANTA 2</th>
            <th>PLANTA 3</th>
            <th>PLANTA 6</th>
            <th>TOTAL GLOBAL</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody">
          <!-- Datos inyectados por JS -->
        </tbody>
      </table>
    </div>
    <button class="btn-gray" onclick="showScreen('screen-menu')">VOLVER AL MENÚ</button>
  </div>

  <!-- 4. REGISTRAR TRASPASO INTERNO -->
  <div id="screen-transfer" class="hidden center-container" style="max-width: 800px; padding-top:0;">
    <h2>NUEVO TRASPASO</h2>
    <form id="form-transfer">
      <div class="form-group">
        <label>SELECCIONAR PIEZA:</label>
        <select id="trans-pieza" required></select>
      </div>
      <div class="form-group">
        <label>PLANTA ORIGEN:</label>
        <select id="trans-origen" required>
          <option value="">-- SELECCIONE ORIGEN --</option>
          <option value="Planta 1">PLANTA 1</option>
          <option value="Planta 2">PLANTA 2</option>
          <option value="Planta 3">PLANTA 3</option>
          <option value="Planta 6">PLANTA 6</option>
        </select>
      </div>
      <div class="form-group">
        <label>PLANTA DESTINO:</label>
        <select id="trans-destino" required>
          <option value="">-- SELECCIONE DESTINO --</option>
          <option value="Planta 1">PLANTA 1</option>
          <option value="Planta 2">PLANTA 2</option>
          <option value="Planta 3">PLANTA 3</option>
          <option value="Planta 6">PLANTA 6</option>
        </select>
      </div>
      <div class="form-group">
        <label>CANTIDAD A MOVER:</label>
        <input type="number" id="trans-qty" min="1" required placeholder="0">
      </div>
      
      <div class="form-group">
        <label>FECHA:</label>
        <input type="date" id="trans-fecha" required>
      </div>
      
      <button type="submit" class="btn-green" style="margin-bottom: 20px;">GUARDAR TRASPASO</button>
      <button type="button" class="btn-gray" onclick="showScreen('screen-menu')">VOLVER AL MENÚ</button>
    </form>
  </div>

  <!-- 5. HISTORIAL DE TRASPASOS -->
  <div id="screen-history" class="hidden">
    <h2>HISTORIAL RECIENTE</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>FECHA</th>
            <th>PIEZA</th>
            <th>ORIGEN</th>
            <th>DESTINO</th>
            <th>CANTIDAD</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <!-- Datos inyectados por JS -->
        </tbody>
      </table>
    </div>
    <button class="btn-gray" onclick="showScreen('screen-menu')">VOLVER AL MENÚ</button>
  </div>

  <script>
    let inventoryData = [
      { sku: "MOD-AC-01", name: "MÓDULO AIRE ACONDICIONADO V8", p1: 150, p2: 45, p3: 300, p6: 200 },
      { sku: "RAD-AL-99", name: "RADIADOR ALUMINIO REFORZADO", p1: 80, p2: 120, p3: 50, p6: 150 },
      { sku: "SOP-MT-55", name: "SOPORTE MOTOR HIDRÁULICO", p1: 200, p2: 200, p3: 1000, p6: 800 },
      { sku: "FIL-CB-22", name: "FILTRO DE CABINA CARBÓN", p1: 500, p2: 800, p3: 1200, p6: 600 },
      { sku: "BOM-AG-77", name: "BOMBA DE AGUA ALTA PRESIÓN", p1: 60, p2: 40, p3: 30, p6: 20 },
      { sku: "COR-VT-88", name: "CORREA VENTILADOR TENSIÓN", p1: 300, p2: 250, p3: 400, p6: 350 },
      { sku: "VAL-EX-33", name: "VÁLVULA EXHAUSTO V6", p1: 90, p2: 70, p3: 110, p6: 95 },
      { sku: "SEN-TM-44", name: "SENSOR TEMPERATURA MOTOR", p1: 150, p2: 130, p3: 160, p6: 140 },
      { sku: "INT-FR-66", name: "INTERCOOLER FRONTAL REFORZADO", p1: 25, p2: 15, p3: 10, p6: 5 },
      { sku: "TUB-RD-11", name: "TUBERÍA RADIADOR DOBLE PARED", p1: 400, p2: 350, p3: 300, p6: 250 }
    ];

    let transferHistory = [];

    window.showScreen = function(screenId) {
      document.querySelectorAll('body > div[id^="screen-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(screenId).classList.remove('hidden');
      
      if(screenId === 'screen-inventory') renderInventory();
      if(screenId === 'screen-history') renderHistory();
      if(screenId === 'screen-transfer') populateTransferSelect();
    };

    function showMessage(msg, isError = false) {
      const box = document.getElementById('message-box');
      box.textContent = msg;
      box.className = isError ? 'msg-error' : '';
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 3000);
    }

    document.getElementById('btn-login').addEventListener('click', () => {
      // Bypass total sin validar el input de usuario o contraseña
      showMessage('ACCESO CONCEDIDO');
      showScreen('screen-menu');
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      document.getElementById('login-user').value = '';
      document.getElementById('login-pass').value = '';
      showScreen('screen-login');
      showMessage('SESIÓN CERRADA');
    });

    function renderInventory() {
      const tbody = document.getElementById('inventory-tbody');
      tbody.innerHTML = '';
      inventoryData.forEach(item => {
        const total = item.p1 + item.p2 + item.p3 + item.p6;
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.sku}</strong><br><small>${item.name}</small></td>
            <td>${item.p1}</td>
            <td>${item.p2}</td>
            <td>${item.p3}</td>
            <td>${item.p6}</td>
            <td style="background:var(--text-color); color:var(--bg-color); font-weight:bold;">${total}</td>
          </tr>
        `;
      });
    }

    function renderHistory() {
      const tbody = document.getElementById('history-tbody');
      tbody.innerHTML = '';
      if(transferHistory.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">NO HAY TRASPASOS REGISTRADOS</td></tr>';
        return;
      }
      transferHistory.forEach(t => {
        tbody.innerHTML += `
          <tr>
            <td>${t.date}</td>
            <td>${t.piece}</td>
            <td>${t.origin}</td>
            <td>${t.dest}</td>
            <td><strong>${t.qty}</strong></td>
          </tr>
        `;
      });
    }

    function populateTransferSelect() {
      const select = document.getElementById('trans-pieza');
      select.innerHTML = '<option value="">-- SELECCIONE PIEZA --</option>';
      inventoryData.forEach(item => {
        select.innerHTML += `<option value="${item.sku}">${item.sku} - ${item.name}</option>`;
      });
      
      // Establecer fecha actual por defecto en el input
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('trans-fecha').value = today;
    }

    document.getElementById('form-transfer').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const pieceId = document.getElementById('trans-pieza').value;
      const origin = document.getElementById('trans-origen').value;
      const dest = document.getElementById('trans-destino').value;
      const qty = parseInt(document.getElementById('trans-qty').value, 10);
      const date = document.getElementById('trans-fecha').value;

      if (origin === dest) {
        showMessage('ORIGEN Y DESTINO NO PUEDEN SER IGUALES', true);
        return;
      }
      
      const item = inventoryData.find(i => i.sku === pieceId);
      const originKey = origin === 'Planta 1' ? 'p1' : origin === 'Planta 2' ? 'p2' : origin === 'Planta 6' ? 'p6' : 'p3';
      const destKey = dest === 'Planta 1' ? 'p1' : dest === 'Planta 2' ? 'p2' : dest === 'Planta 6' ? 'p6' : 'p3';

      if (qty > item[originKey]) {
        showMessage(`STOCK INSUFICIENTE EN ${origin.toUpperCase()} (DISPONIBLE: ${item[originKey]})`, true);
        return;
      }

      // Descontar y sumar inventario localmente en memoria
      item[originKey] -= qty;
      item[destKey] += qty;

      // Guardar en el historial local (más recientes primero)
      transferHistory.unshift({ 
        date: date, 
        piece: item.name, 
        origin: origin, 
        dest: dest, 
        qty: qty 
      });

      showMessage('TRASPASO REGISTRADO CORRECTAMENTE');
      document.getElementById('form-transfer').reset();
      showScreen('screen-menu');
    });
  </script>
</body>
</html>
